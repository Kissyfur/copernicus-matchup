[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copernicus-matchup"
version = "0.7.0"
description = "Match in-situ observations against Copernicus Marine products and build aligned feature cubes."
requires-python = ">=3.9"
readme = "README.md"

# Floors only, deliberately no upper bounds, and every floor is the oldest version the
# test suite has actually passed on.
#
# The package is meant to be installed into a consuming project's environment without
# moving anything that project already has: pip leaves an installed version alone when it
# satisfies the floor, so a floor set too high is what forces an upgrade. numpy is the one
# that matters. TensorFlow 2.10, the last release with native Windows GPU support, runs on
# numpy 1.x but does not declare numpy<2, so a numpy floor above the consumer's version
# sends pip straight to numpy 2 and breaks TensorFlow. Its floor is therefore the lowest
# pandas 2.1 accepts, and the suite passes there (Python 3.9, numpy 1.22.4, pandas 2.1.0,
# xarray 2023.11.0, scipy 1.10.0, netCDF4 1.6.0) as well as on the latest releases.
#
# Output crosses to consumers as NetCDF and CSV, never as pickles or .npy, so a consumer in
# a separate environment is not tied to these versions either: artifacts written under
# numpy 2.0.2 / pandas 2.3.3 / xarray 2024.7 were read back bit-exactly under numpy 1.24.4 /
# pandas 2.1.4 / xarray 2023.11.
dependencies = [
  "numpy>=1.22.4",
  "pandas>=2.1",
  "xarray>=2023.11",
  # xarray's `.interp`, used by the regrid and gap-filling steps.
  "scipy>=1.10",
  # A netCDF backend for `.to_netcdf` / `.load_dataarray`.
  "netCDF4>=1.6",
  # Config files are YAML; imported lazily but effectively always needed.
  "PyYAML>=6.0",
]

[project.scripts]
copernicus-matchup = "copernicus_matchup.cli:main"

[project.optional-dependencies]
# Only the download stage needs this; `open_local_or_remote` works on local NetCDF
# without it, and the import error names the missing package. Kept optional because its
# own dependency tree is large.
download = ["copernicusmarine>=2.0"]
# Target tables given as .xls/.xlsx rather than .csv: pandas reads .xlsx with openpyxl and
# legacy .xls with xlrd.
excel = ["openpyxl>=3.1", "xlrd>=2.0.1"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["copernicus_matchup*"]

[tool.pytest.ini_options]
pythonpath = ["."]
